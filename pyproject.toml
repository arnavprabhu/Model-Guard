[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-guard"
version = "0.1.0"
description = "Personal-brand runtime safety layer for AI coding agents: TypeSafe/Jev semantic risk judgments with deterministic ALLOW / REQUIRE APPROVAL / BLOCK decisions and an auditable trail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Model Guard" }]
keywords = ["ai-agents", "safety", "guardrails", "typesafe", "jev"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
model-guard = "model_guard.cli:main"
model-guard-hook = "model_guard.hook:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
